{% extends "base.html" %}

{% block title %}Reset Password - Shree Devi Institute of Technology{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div style="font-size: 2.25rem; margin-bottom: 0.5rem;">🔑</div>
      <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--primary-900);">Set New Password</h2>
      <p style="font-size: 0.875rem; color: var(--text-muted); margin-top: 0.25rem;">
        Shree Devi Institute of Technology &bull; College Notice Board
      </p>
    </div>

    <div id="alertBox" style="display:none; padding: 0.75rem 1rem; border-radius: var(--radius-sm); font-size: 0.875rem; margin-bottom: 1.25rem;"></div>

    <form id="resetForm" onsubmit="handleResetSubmit(event)">
      <input type="hidden" id="tokenInput" value="{{ token }}">

      <div class="form-group">
        <label for="newPassword" class="form-label">New Password</label>
        <div class="password-input-wrapper">
          <input 
            type="password" 
            id="newPassword" 
            name="newPassword" 
            class="form-input" 
            placeholder="Min 6 characters (faculty min 8)" 
            required 
            minlength="6"
            autocomplete="new-password"
          >
          <button type="button" class="password-toggle-btn" data-target="newPassword">Show</button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword" class="form-label">Confirm New Password</label>
        <div class="password-input-wrapper">
          <input 
            type="password" 
            id="confirmPassword" 
            name="confirmPassword" 
            class="form-input" 
            placeholder="Re-type your new password" 
            required 
            minlength="6"
            autocomplete="new-password"
          >
          <button type="button" class="password-toggle-btn" data-target="confirmPassword">Show</button>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary btn-block" style="margin-top: 0.75rem; padding: 0.75rem;">
        Update & Save Password
      </button>
    </form>

    <div style="margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--surface-border); text-align: center; font-size: 0.875rem;">
      <a href="/login" style="color: var(--brand-blue); text-decoration: none; font-weight: 600;">
        &larr; Back to Portal Sign In
      </a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function handleResetSubmit(e) {
  e.preventDefault();
  const token = document.getElementById("tokenInput").value.trim();
  const newPassword = document.getElementById("newPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  const alertBox = document.getElementById("alertBox");
  const submitBtn = document.getElementById("submitBtn");

  if (!token) {
    alertBox.style.display = "block";
    alertBox.style.background = "var(--urgent-bg)";
    alertBox.style.borderColor = "var(--urgent-border)";
    alertBox.style.color = "var(--urgent-red)";
    alertBox.textContent = "Invalid or missing reset token. Please request a new recovery link.";
    return;
  }

  if (newPassword !== confirmPassword) {
    alertBox.style.display = "block";
    alertBox.style.background = "var(--urgent-bg)";
    alertBox.style.borderColor = "var(--urgent-border)";
    alertBox.style.color = "var(--urgent-red)";
    alertBox.textContent = "New password and confirmation do not match.";
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Resetting Password...";
  alertBox.style.display = "none";

  try {
    const res = await fetch("/api/auth/reset-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        token: token,
        new_password: newPassword,
        confirm_password: confirmPassword
      })
    });
    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.detail || "Unable to reset password.");
    }

    alertBox.style.display = "block";
    alertBox.style.background = "var(--success-bg)";
    alertBox.style.borderColor = "var(--success-border)";
    alertBox.style.color = "var(--success-green)";
    alertBox.innerHTML = `<strong>Success!</strong> ${data.message} <br><br><a href="/login" class="btn btn-primary btn-sm" style="margin-top:0.5rem;display:inline-block;">Proceed to Sign In</a>`;
    document.getElementById("resetForm").style.display = "none";
  } catch (err) {
    alertBox.style.display = "block";
    alertBox.style.background = "var(--urgent-bg)";
    alertBox.style.borderColor = "var(--urgent-border)";
    alertBox.style.color = "var(--urgent-red)";
    alertBox.textContent = err.message;
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Update & Save Password";
  }
}
</script>
{% endblock %}
