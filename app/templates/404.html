{% extends "base.html" %}

{% block title %}Notice Not Found (404){% endblock %}

{% block content %}
<div class="empty-state" style="max-width: 540px; margin: 4rem auto;">
  <div class="empty-icon">🔍</div>
  <h2 class="empty-title">Page or Notice Not Found</h2>
  <p class="empty-desc">
    {{ error or "The notice you are trying to view does not exist, has expired, or has been removed by the administration." }}
  </p>
  <div style="display: flex; gap: 0.75rem; justify-content: center;">
    <a href="/" class="btn btn-primary">Return to Notice Board</a>
  </div>
</div>
{% endblock %}
